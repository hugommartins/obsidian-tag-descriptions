name: Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Generate flat-square badge SVG
        run: |
          node -e '
            const fs = require("fs");
            const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
            const pct = Math.round(summary.total.lines.pct);
            const color = pct >= 80 ? "brightgreen" : pct >= 60 ? "yellow" : "red";
            const url = `https://img.shields.io/badge/coverage-${pct}%25-${color}?style=flat-square`;
            fetch(url)
              .then(res => res.text())
              .then(svg => fs.writeFileSync("/tmp/badge.svg", svg));
          '

      - name: Commit and push badge to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf .
          mkdir -p assets
          cp /tmp/badge.svg assets/badge.svg
          git add -f assets/badge.svg
          git commit -m "chore: update coverage badge" || exit 0
          git push -f origin badges